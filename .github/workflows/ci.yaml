name: CI Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Least privilege by default; the job below adds only what it needs.
permissions:
  contents: read

# Supply chain (Phase 4 B.1, finding L4-8):
# - Every action is pinned by commit SHA (version in the comment). Tags can be moved, as in
#   the March 2026 trivy-action compromise (CVE-2026-33634); a SHA cannot.
# - The image is scanned BEFORE it is pushed: a fixable CRITICAL vulnerability fails the build.
# - The pushed digest is signed keyless with cosign (GitHub OIDC identity of this workflow) and
#   carries an SPDX SBOM attestation. Spokes admit only images signed by this identity (B.4).
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless signing (Sigstore Fulcio certificate for this workflow)
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Syntax & Lint Check
        run: |
          python3 -m py_compile src/main.py

      - name: Get build timestamp
        id: build_time
        run: echo "time=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: orders-processor:scan
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.time }}
          cache-to: type=gha,mode=max

      - name: Vulnerability report (CRITICAL + HIGH, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: orders-processor:scan
          severity: CRITICAL,HIGH
          format: table
          exit-code: '0'

      - name: Vulnerability gate (fixable CRITICAL fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: orders-processor:scan
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          skip-setup-trivy: true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Each published tag is written exactly once (Phase 3 PV3-11 / D-27):
          #   v* git tag push  -> v<version> only
          #   branch push      -> sha-<commit> only
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,format=short,prefix=sha-,enable=${{ github.ref_type == 'branch' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            BUILD_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.build_time.outputs.time }}
          cache-from: type=gha

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Generate SBOM (SPDX) for the pushed digest
        if: github.event_name != 'pull_request'
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Sign the image and attest the SBOM (keyless)
        if: github.event_name != 'pull_request'
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
          echo "Signed and attested: $REF" >> "$GITHUB_STEP_SUMMARY"
